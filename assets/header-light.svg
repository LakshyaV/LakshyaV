<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 250" width="840" height="250" role="img" aria-label="Lakshya Vasudeva. 18. building origin. research at harvard.">
  <style>
    .name { font: 600 54px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; letter-spacing: -1.6px; fill: #1f2328; }
    .bio { font: 400 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #59636e; }
    .bio tspan { fill: #1f2328; }
    .mono { font: 400 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 0.4px; fill: #59636e; }
    .mono .on { fill: #cf4a1c; }
    .trace { fill: none; stroke: #cf4a1c; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round;
             stroke-dasharray: 3400; animation: draw 3.2s cubic-bezier(.3,.1,.2,1) .2s backwards; }
    .rise { animation: rise .9s ease-out backwards; }
    .dot { fill: #cf4a1c; animation: show .3s linear 3.3s backwards, pulse 1.8s ease-in-out 3.6s infinite; }
    .label { animation: show .8s ease-out 2.4s backwards; }
    /* Everything rests in its final state, so a renderer that does not
       animate still shows the finished picture. */
    @keyframes draw { from { stroke-dashoffset: 3400; } to { stroke-dashoffset: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    @keyframes show { from { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) {
      .trace, .rise, .dot, .label { animation: none; }
    }
  </style>
  <text class="mono rise" x="2" y="26">curiosity <tspan class="on">→</tspan> systems <tspan class="on">→</tspan> intelligence <tspan class="on">→</tspan> humans <tspan class="on">→</tspan> interfaces</text>
