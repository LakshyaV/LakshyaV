<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 178" width="412" height="178" role="img" aria-label="llm-inference-engine">
  <style>
    .kind { font: 500 10.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 1.3px; text-transform: uppercase; fill: #ff7b54; }
    .title { font: 600 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; letter-spacing: -0.2px; fill: #f0f6fc; }
    .body { font: 400 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #9198a1; }
    .tags { font: 400 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #9198a1; }
    .arrow { font: 400 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #9198a1; }
  </style>
  <rect x="0.5" y="0.5" width="411" height="177" rx="10" fill="#0d1117" stroke="#30363d"/>
