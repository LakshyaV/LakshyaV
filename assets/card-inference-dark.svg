  <text class="arrow" x="390" y="33" text-anchor="end">↗</text>
  <text class="title" x="22" y="59">llm-inference-engine</text>
  <text class="body" x="22" y="86">LLM inference for Apple GPUs, from scratch: C++ and</text><text class="body" x="22" y="105">hand-written Metal kernels. Runs int4 Qwen2.5 at</text><text class="body" x="22" y="124">speeds comparable to llama.cpp.</text>
  <line x1="22" y1="142" x2="390" y2="142" stroke="#30363d" stroke-dasharray="1 4" stroke-linecap="round"/>
