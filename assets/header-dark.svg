<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 262" width="840" height="262" role="img" aria-label="Lakshya Vasudeva. Started coding at 7 and teaching at 8. Interned at Zebra Technologies, worked with Interac, researched at Harvard. Now building Origin, a wearable to talk to your AI agents telepathically.">
  <style>
    .name { font: 600 54px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; letter-spacing: -1.6px; fill: #f0f6fc; }
    .bio { font: 400 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #9198a1; }
    .bio tspan { fill: #f0f6fc; }
    .cap { font: 400 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 0.3px; fill: #9198a1; }
    .trace { fill: none; stroke: #ff7b54; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;
             stroke-dasharray: 6000; animation: draw 3.2s cubic-bezier(.3,.1,.2,1) .2s backwards; }
    .rise { animation: rise .9s ease-out backwards; }
    .dot { fill: #ff7b54; animation: show .3s linear 3.3s backwards, pulse 1.8s ease-in-out 3.6s infinite; }
    /* Everything rests in its final state, so a renderer that does not
       animate still shows the finished picture. */
    @keyframes draw { from { stroke-dashoffset: 6000; } to { stroke-dashoffset: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    @keyframes show { from { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) {
      .trace, .rise, .dot { animation: none; }
    }
  </style>
  <text class="name rise" x="0" y="58">Lakshya Vasudeva</text>
  <text class="bio rise" x="2" y="100" style="animation-delay:.2s">Started coding at 7 and teaching at 8.</text>
  <text class="bio rise" x="2" y="127" style="animation-delay:.35s">Interned at <tspan>Zebra Technologies</tspan>, worked with <tspan>Interac</tspan>, researched at <tspan>Harvard</tspan>.</text>
  <text class="bio rise" x="2" y="154" style="animation-delay:.5s">Now building <tspan>Origin</tspan> -- a wearable to talk to your AI agents telepathically.</text>
